name: Deploy

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build image & deploy to Server 1
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            VITE_API_BASE_URL=${{ secrets.MASTER_URL }}
            VITE_AI_BASE_URL=${{ secrets.MASTER_URL }}
          tags: ghcr.io/${{ env.OWNER }}/diploma-ui:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.OWNER }}/diploma-ui:cache
          cache-to: type=registry,ref=ghcr.io/${{ env.OWNER }}/diploma-ui:cache,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER1_HOST }}
          username: ${{ secrets.SERVER1_USER }}
          key: ${{ secrets.SERVER1_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ env.OWNER }} --password-stdin
            cd ~/loadforge
            docker compose -f docker-compose.prod.yml pull ui
            docker compose -f docker-compose.prod.yml up -d ui
            docker compose -f docker-compose.prod.yml restart nginx
            docker image prune -f
